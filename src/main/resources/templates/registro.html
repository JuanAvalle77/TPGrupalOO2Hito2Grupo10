<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registro Unidad de Venta</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container my-5" style="max-width: 800px;">
    <div class="card shadow">
        <div class="card-header bg-primary text-white">
            <h3 class="card-title mb-0">Registrar Unidad de Venta y Responsable</h3>
        </div>
        <div class="card-body">

            <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

            <form th:action="@{/registro}" th:object="${registroDTO}" method="post">

                <h5 class="text-primary border-bottom pb-2">Festival</h5>
                <div class="mb-3">
                    <label for="festivalId" class="form-label">Seleccionar Festival</label>
                    <select id="festivalId" th:field="*{festivalId}" class="form-select"
                            th:classappend="${#fields.hasErrors('festivalId')} ? 'is-invalid'">
                        <option value="">Seleccionar</option>
                        <option th:each="f : ${festivales}" th:value="${f.id}" th:text="${f.nombre}"></option>
                    </select>
                    <div class="invalid-feedback" th:errors="*{festivalId}"></div>
                </div>

                <h5 class="text-primary border-bottom pb-2">Datos de la Unidad de Venta</h5>
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Nombre Comercial</label>
                        <input type="text" th:field="*{nombreComercial}" class="form-control"
                               th:classappend="${#fields.hasErrors('nombreComercial')} ? 'is-invalid'">
                        <div class="invalid-feedback" th:errors="*{nombreComercial}"></div>
                    </div>
                    <div class="col-md-3 mb-3">
                        <label class="form-label">Superficie (m²)</label>
                        <input type="number" step="0.01" th:field="*{superficie}" class="form-control"
                               th:classappend="${#fields.hasErrors('superficie')} ? 'is-invalid'">
                        <div class="invalid-feedback" th:errors="*{superficie}"></div>
                    </div>
                    <div class="col-md-3 mb-3">
                        <label class="form-label">Código (Ej: AA12345678)</label>
                        <input type="text" placeholder="AA12345678" maxlength="10" th:field="*{codigo}"
                               class="form-control" th:classappend="${#fields.hasErrors('codigo')} ? 'is-invalid'">
                        <div class="invalid-feedback" th:errors="*{codigo}"></div>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Tipo de Unidad</label>
                    <select id="tipoUnidad" th:field="*{tipoUnidad}" class="form-select" onchange="toggleTipoUnidad()">
                        <option value="FOOD_TRUCK">Food Truck</option>
                        <option value="PUESTO">Puesto Desarmable</option>
                    </select>
                </div>

                <div class="row border rounded p-3 mb-3 bg-white" id="camposFoodTruck">
                    <div class="col-md-6">
                        <label class="form-label">Patente</label>
                        <input type="text" th:field="*{patente}" class="form-control">
                    </div>
                    <div class="col-md-6 d-flex align-items-center pt-4">
                        <div class="form-check">
                            <input id="reqElec" type="checkbox" th:field="*{requiereElectricidad}" class="form-check-input">
                            <label class="form-check-label" for="reqElec">Requiere Conexión Eléctrica</label>
                        </div>
                    </div>
                </div>

                <div class="row border rounded p-3 mb-3 bg-white d-none" id="camposPuesto">
                    <div class="col-md-6">
                        <label class="form-label">Cantidad de Carpas</label>
                        <input type="number" th:field="*{carpas}" class="form-control">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Tiempo de Montaje (Minutos)</label>
                        <input type="number" th:field="*{minutosMontaje}" class="form-control">
                    </div>
                </div>

                <h5 class="text-primary border-bottom pb-2 mt-4">Datos del Responsable (Staff)</h5>
                <div class="row">
                    <div class="col-md-4 mb-3">
                        <label class="form-label">Nombre</label>
                        <input type="text" th:field="*{nombre}" class="form-control"
                               th:classappend="${#fields.hasErrors('nombre')} ? 'is-invalid'">
                        <div class="invalid-feedback" th:errors="*{nombre}"></div>
                    </div>
                    <div class="col-md-4 mb-3">
                        <label class="form-label">Apellido</label>
                        <input type="text" th:field="*{apellido}" class="form-control"
                               th:classappend="${#fields.hasErrors('apellido')} ? 'is-invalid'">
                        <div class="invalid-feedback" th:errors="*{apellido}"></div>
                    </div>
                    <div class="col-md-4 mb-3">
                        <label class="form-label">DNI</label>
                        <input type="number" th:field="*{dni}" class="form-control"
                               th:classappend="${#fields.hasErrors('dni')} ? 'is-invalid'">
                        <div class="invalid-feedback" th:errors="*{dni}"></div>
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-4 mb-3">
                        <label class="form-label">Fecha de Nacimiento</label>
                        <input type="date" th:field="*{fechaNacimiento}" class="form-control"
                               th:classappend="${#fields.hasErrors('fechaNacimiento')} ? 'is-invalid'">
                        <div class="invalid-feedback" th:errors="*{fechaNacimiento}"></div>
                    </div>
                    <div class="col-md-4 mb-3">
                        <label class="form-label">Fecha de Ingreso</label>
                        <input type="date" th:field="*{fechaIngreso}" class="form-control"
                               th:classappend="${#fields.hasErrors('fechaIngreso')} ? 'is-invalid'">
                        <div class="invalid-feedback" th:errors="*{fechaIngreso}"></div>
                    </div>
                    <div class="col-md-4 mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" th:field="*{email}" class="form-control"
                               th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'">
                        <div class="invalid-feedback" th:errors="*{email}"></div>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Rol del Personal</label>
                    <select class="form-select" th:field="*{tipoPersonal}">
                        <option value="COCINERO">Cocinero</option>
                        <option value="CAJERO">Cajero</option>
                    </select>
                </div>

                        <h5 class="text-primary border-bottom pb-2 mt-4">Crear Usuario</h5>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Username</label>
                                <input type="text" th:field="*{userName}" class="form-control"
                                       th:classappend="${#fields.hasErrors('userName')} ? 'is-invalid'">
                                <div class="invalid-feedback" th:errors="*{userName}"></div>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Contraseña</label>
                                <input type="password" th:field="*{password}" class="form-control"
                                       th:classappend="${#fields.hasErrors('password')} ? 'is-invalid'">
                                <div class="invalid-feedback" th:errors="*{password}"></div>
                            </div>
                        </div>

                        <div class="d-flex justify-content-between mt-4">
                            <a th:href="@{/}" class="btn btn-secondary">Cancelar</a>
                            <button type="submit" class="btn btn-success btn-lg">Registrar Unidad</button>
                        </div>

            </form>
        </div>
    </div>
</div>

<script>
    function toggleTipoUnidad() {
        const tipo = document.getElementById('tipoUnidad').value;
        const ft = document.getElementById('camposFoodTruck');
        const puesto = document.getElementById('camposPuesto');
        if (tipo === 'FOOD_TRUCK') {
            ft.classList.remove('d-none');
            puesto.classList.add('d-none');
        } else {
            ft.classList.add('d-none');
            puesto.classList.remove('d-none');
        }
    }
</script>
</body>
</html>
