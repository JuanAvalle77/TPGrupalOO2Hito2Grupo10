<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head">
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Epicentro Gourmet</title>
    <link rel="stylesheet" th:href="@{/vendor/bootstrap/css/bootstrap.min.css}"/>
    <link rel="stylesheet" th:href="@{/css/modern-business.css}"/>
</head>
<body>

    <!-- Navbar: cada caso de uso agrega su link en el bloque del rol que corresponda -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top" th:fragment="navbar">
        <div class="container">
            <a class="navbar-brand" th:href="@{/}">Epicentro Gourmet</a>
            <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav mr-auto">
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/}">Inicio</a>
                    </li>

                    <!-- ADMIN -->
                    <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                        <a class="nav-link" th:href="@{/admin}">Panel Administrador</a>
                    </li>

                    <!-- RESPONSABLE -->
                    <li class="nav-item" sec:authorize="hasRole('RESPONSABLE')">
                        <a class="nav-link" th:href="@{/responsable}">Panel Responsable</a>
                    </li>

                    <!-- EMPLEADO -->
                    <li class="nav-item" sec:authorize="hasRole('EMPLEADO')">
                        <a class="nav-link" th:href="@{/empleado}">Mi panel</a>
                    </li>
                </ul>
                <ul class="navbar-nav">
                    <li class="nav-item" sec:authorize="!isAuthenticated()">
                        <a class="nav-link" th:href="@{/login}">Iniciar sesion</a>
                    </li>
                    <li class="nav-item dropdown" sec:authorize="isAuthenticated()">
                        <a class="nav-link dropdown-toggle" href="#" role="button" data-toggle="dropdown">
                            <span sec:authentication="name">Usuario</span>
                        </a>
                        <div class="dropdown-menu dropdown-menu-right">
                            <form th:action="@{/logout}" method="post">
                                <button type="submit" class="dropdown-item">Cerrar sesion</button>
                            </form>
                        </div>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <footer class="bg-dark text-white py-4" th:fragment="footer">
        <div class="container text-center">
            <p class="mb-0">&copy; 2026 UNLa - Orientacion a Objetos II - Grupo 10</p>
        </div>
    </footer>

    <div th:fragment="scripts">
        <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
        <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
    </div>

</body>
</html>
