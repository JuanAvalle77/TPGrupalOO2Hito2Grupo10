<!DOCTYPE html>
<html lang="en">
<head th:replace="~{layout :: head}"></head>
<body>
    <nav th:replace="~{layout :: navbar}"></nav>
    <div class="container my-5" style="max-width:700px;">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>Plato Estrella por Festival</h2>
            <a th:href="@{/}" class="btn btn-outline-secondary">Volver</a>
        </div>
        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
        <div class="card shadow-sm mb-4">
            <div class="card-body">
                <form th:action="@{/responsable/plato-estrella}" method="get" class="row g-3 align-items-center">
                    <div class="col-md-8">
                        <label for="festivalId" class="form-label fw-bold">Seleccionar Festival</label>
                        <select id="festivalId" name="festivalId" class="form-select" required>
                            <option value="">-- Seleccionar --</option>
                            <option th:each="f : ${festivales}"
                                    th:value="${f.id}"
                                    th:text="${f.nombre}"
                                    th:selected="${f.id == festivalSeleccionado}">
                            </option>
                        </select>
                    </div>
                    <div class="col-md-4 pt-4">
                        <button type="submit" class="btn btn-warning w-100 fw-bold">Consultar</button>
                    </div>
                </form>
            </div>
        </div>
        <div th:if="${busquedaRealizada}">
            <div th:if="${platoEstrella != null}" class="card border-warning shadow">
                <div class="card-header bg-warning text-dark text-center">
                    <h3 class="mb-0">⭐ Plato Estrella Encontrado ⭐</h3>
                </div>
                <div class="card-body text-center p-4">
                    <h2 class="card-title text-primary fw-bold mb-3" th:text="${platoEstrella.nombre}">Choripan</h2>

                    <div class="row mt-4">
                        <div class="col-md-4">
                            <div class="p-3 bg-light rounded border">
                                <small class="text-muted d-block">Precio de Venta</small>
                                <span class="fs-4 fw-bold text-success" th:text="'$' + ${platoEstrella.precioVenta}">$0.0</span>
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div class="p-3 bg-light rounded border">
                                <small class="text-muted d-block">Unidades Vendidas</small>
                                <span class="fs-4 fw-bold text-dark" th:text="${platoEstrella.unidadesVendidas}">0</span>
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div class="p-3 bg-light rounded border">
                                <small class="text-muted d-block">Pedidos Realizados</small>
                                <span class="fs-4 fw-bold text-secondary" th:text="${platoEstrella.cantidadPedidos}">0</span>
                            </div>
                        </div>
                    </div>
                </div>
                <div th:if="${platoEstrella == null}" class="alert alert-info text-center mt-3">
                    No se registraron ventas ni pedidos para la unidad en el festival seleccionado.
                </div>
            </div>
    </div>
</body>
</html>
