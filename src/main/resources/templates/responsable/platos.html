<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head}"></head>
<body>
    <nav th:replace="~{layout :: navbar}"></nav>
    <main class="container py-4">
        <div class="panel-head"><span class="rol">Responsable</span><h2>Menú de la unidad</h2></div>
        <div class="alert alert-success" th:if="${ok}" th:text="${ok}"></div>
        <div class="card p-4 mb-4" th:if="${unidadSeleccionada}">
            <h3 class="h5" th:text="${unidadSeleccionada.nombreComercial}">Unidad</h3>
            <p class="text-muted mb-0" th:text="${unidadSeleccionada.festival.nombre}">Festival</p>
        </div>
        <a class="btn btn-dorado mb-3" th:href="@{/responsable/platos/nuevo}" th:if="${!#lists.isEmpty(unidades)}">Agregar plato</a>
        <div class="alert alert-info" th:if="${#lists.isEmpty(unidades)}">No tenés unidades de venta a cargo.</div>
        <div class="table-responsive" th:if="${!#lists.isEmpty(unidades)}">
            <table class="table table-striped">
                <thead><tr><th>Plato</th><th>Precio</th><th>Costo</th><th>Ganancia por unidad</th></tr></thead>
                <tbody>
                    <tr th:each="plato : ${platos}">
                        <td th:text="${plato.nombre}">Nombre</td>
                        <td th:text="${#numbers.formatDecimal(plato.precioVenta, 1, 'POINT', 2, 'COMMA')}">$0</td>
                        <td th:text="${#numbers.formatDecimal(plato.costoProduccion, 1, 'POINT', 2, 'COMMA')}">$0</td>
                        <td th:text="${#numbers.formatDecimal(plato.calcularGanancia(), 1, 'POINT', 2, 'COMMA')}">$0</td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(platos)}"><td colspan="4" class="text-muted">Todavía no hay platos cargados.</td></tr>
                </tbody>
            </table>
        </div>
    </main>
    <footer th:replace="~{layout :: footer}"></footer><div th:replace="~{layout :: scripts}"></div>
</body>
</html>
