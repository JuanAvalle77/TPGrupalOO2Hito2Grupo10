<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head}"></head>
<body class="bg-light">
<nav th:replace="~{layout :: navbar}"></nav>
<div class="container my-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Menú de Mi Unidad de Venta</h2>
        <div>
            <a th:href="@{/responsable/platos/nuevo}" class="btn btn-success">+ Nuevo Plato</a>
            <a th:href="@{/}" class="btn btn-outline-secondary">Volver al Inicio</a>
        </div>
    </div>

    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <div class="card shadow">
        <div class="card-body">
            <table class="table table-striped table-hover mb-0">
                <thead class="table-dark">
                <tr>
                    <th>#</th>
                    <th>Nombre del Plato</th>
                    <th>Costo de Producción</th>
                    <th>Precio de Venta</th>
                    <th>Margen de Ganancia</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="p : ${platos}">
                    <td th:text="${p.id}">1</td>
                    <td th:text="${p.nombre}" class="fw-bold">Nombre</td>
                    <td th:text="${p.costoProduccion != null ? '$' + p.costoProduccion : '$0.0'}">$0.0</td>
                    <td th:text="${p.precioVenta != null ? '$' + p.precioVenta : '$0.0'}">$0.0</td>
                    <td class="text-success fw-bold"
                        th:text="${(p.precioVenta != null and p.costoProduccion != null) ? '$' + (p.precioVenta - p.costoProduccion) : '$0.0'}">
                        $0.0
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(platos)}">
                    <td colspan="5" class="text-center text-muted">No hay platos registrados en tu unidad.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
