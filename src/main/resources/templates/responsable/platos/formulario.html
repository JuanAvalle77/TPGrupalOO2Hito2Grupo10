<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Nuevo plato - Epicentro Gourmet</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container my-5" style="max-width: 600px;">
    <div class="card shadow">
        <div class="card-header bg-success text-white">
            <h4 class="mb-0">Alta de Nuevo Plato</h4>
        </div>
        <div class="card-body">

            <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

            <form th:action="@{/responsable/platos/nuevo}" th:object="${plato}" method="post">

                <div class="mb-3">
                    <label class="form-label">Nombre del Plato *</label>
                    <input type="text" th:field="*{nombre}" class="form-control"
                           th:classappend="${#fields.hasErrors('nombre')} ? 'is-invalid'">
                    <div class="invalid-feedback" th:errors="*{nombre}"></div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Costo de Producción ($) *</label>
                    <input type="number" step="0.01" th:field="*{costoProduccion}" class="form-control"
                           th:classappend="${#fields.hasErrors('costoProduccion')} ? 'is-invalid'">
                    <div class="invalid-feedback" th:errors="*{costoProduccion}"></div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Precio de Venta ($) *</label>
                    <input type="number" step="0.01" th:field="*{precioVenta}" class="form-control"
                           th:classappend="${#fields.hasErrors('precioVenta')} ? 'is-invalid'">
                    <div class="invalid-feedback" th:errors="*{precioVenta}"></div>
                    <small class="text-muted">El precio de venta debe ser estrictamente mayor al costo de producción.</small>
                </div>

                <div class="d-flex justify-content-between pt-3">
                    <a th:href="@{/responsable/platos}" class="btn btn-secondary">Cancelar</a>
                    <button type="submit" class="btn btn-success">Guardar Plato</button>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
