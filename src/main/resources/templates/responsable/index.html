<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head}"></head>
<body>
    <nav th:replace="~{layout :: navbar}"></nav>

    <main class="container">
        <div class="panel-head">
            <span class="rol">Responsable</span>
            <h2>Panel del Responsable</h2>
        </div>

        <div class="row">
            <!-- Cada caso de uso de responsable reemplaza su tarjeta por un <a class="cu-card" th:href="..."> -->
            <div class="col-md-6 mb-4"><div class="cu-card"><span class="pendiente">Pendiente</span>
                <h4>Empleados</h4><p>Alta, baja, modificación y filtros de empleados.</p></div></div>
            <div class="col-md-6 mb-4"><div class="cu-card"><span class="pendiente">Pendiente</span>
                <h4>Platos</h4><p>Alta de platos de la unidad.</p></div></div>
            <div class="col-md-6 mb-4"><div class="cu-card"><span class="pendiente">Pendiente</span>
                <h4>Canon y haberes</h4><p>Cálculo de canon y liquidación de haberes.</p></div></div>
            <div class="col-md-6 mb-4"><div class="cu-card"><span class="pendiente">Pendiente</span>
                <h4>Reportes</h4><p>Recaudación, rentabilidad neta y plato estrella.</p></div></div>
        </div>
    </main>

    <footer th:replace="~{layout :: footer}"></footer>
    <div th:replace="~{layout :: scripts}"></div>
</body>
</html>
