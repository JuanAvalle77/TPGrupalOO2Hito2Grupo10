<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head}"></head>
<body>
    <nav th:replace="~{layout :: navbar}"></nav>

    <main class="container py-4">
        <div class="panel-head">
            <span class="rol">Registro público</span>
            <h2>Registrar unidad de venta</h2>
            <p>Completá los datos de la unidad y de la persona responsable. Al finalizar vas a poder iniciar sesión.</p>
        </div>

        <div class="alert alert-danger" role="alert" th:if="${errorRegistro}" th:text="${errorRegistro}"></div>
        <div class="alert alert-warning" th:if="${#lists.isEmpty(festivales)}">
            Todavía no hay festivales disponibles para asociar una unidad.
        </div>

        <form th:action="@{/registro}" th:object="${registroUnidadForm}" method="post" class="card p-4 mb-5">
            <fieldset th:disabled="${#lists.isEmpty(festivales)}">
                <h3 class="h5 mb-3">Unidad de venta</h3>
                <div class="form-row">
                    <div class="form-group col-md-6">
                        <label for="festivalId">Festival</label>
                        <select id="festivalId" class="form-control" th:field="*{festivalId}">
                            <option value="">Seleccioná un festival</option>
                            <option th:each="festival : ${festivales}" th:value="${festival.id}"
                                    th:text="${festival.nombre} + ' (' + ${#temporals.format(festival.fechaInicio, 'dd/MM/yyyy')} + ' - ' + ${#temporals.format(festival.fechaFin, 'dd/MM/yyyy')} + ')'">
                            </option>
                        </select>
                        <small class="text-danger" th:errors="*{festivalId}"></small>
                    </div>
                    <div class="form-group col-md-6">
                        <label for="tipoUnidad">Tipo de unidad</label>
                        <select id="tipoUnidad" class="form-control" th:field="*{tipoUnidad}" onchange="actualizarUnidad()">
                            <option value="">Seleccioná un tipo</option>
                            <option value="FOOD_TRUCK">Food Truck</option>
                            <option value="PUESTO">Puesto desarmable</option>
                        </select>
                        <small class="text-danger" th:errors="*{tipoUnidad}"></small>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group col-md-6">
                        <label for="nombreComercial">Nombre comercial</label>
                        <input id="nombreComercial" class="form-control" th:field="*{nombreComercial}" maxlength="120"/>
                        <small class="text-danger" th:errors="*{nombreComercial}"></small>
                    </div>
                    <div class="form-group col-md-3">
                        <label for="superficie">Superficie (m²)</label>
                        <input id="superficie" class="form-control" type="number" min="0.01" step="0.01" th:field="*{superficie}"/>
                        <small class="text-danger" th:errors="*{superficie}"></small>
                    </div>
                    <div class="form-group col-md-3">
                        <label for="codigo">Código (AA00000000)</label>
                        <input id="codigo" class="form-control" th:field="*{codigo}" maxlength="10"/>
                        <small class="text-danger" th:errors="*{codigo}"></small>
                    </div>
                </div>
                <div id="camposFoodTruck" class="form-row d-none">
                    <div class="form-group col-md-6">
                        <label for="patente">Patente</label>
                        <input id="patente" class="form-control" th:field="*{patente}"/>
                    </div>
                    <div class="form-group col-md-6 d-flex align-items-center pt-3">
                        <div class="form-check">
                            <input id="requiereElectricidad" class="form-check-input" type="checkbox" th:field="*{requiereElectricidad}"/>
                            <label class="form-check-label" for="requiereElectricidad">Requiere conexión eléctrica</label>
                        </div>
                    </div>
                </div>
                <div id="camposPuesto" class="form-row d-none">
                    <div class="form-group col-md-6">
                        <label for="cantidadCarpas">Cantidad de carpas</label>
                        <input id="cantidadCarpas" class="form-control" type="number" min="1" th:field="*{cantidadCarpas}"/>
                    </div>
                    <div class="form-group col-md-6">
                        <label for="tiempoMontaje">Tiempo de montaje (minutos)</label>
                        <input id="tiempoMontaje" class="form-control" type="number" min="0" th:field="*{tiempoMontaje}"/>
                    </div>
                </div>

                <hr/>
                <h3 class="h5 mb-3">Responsable</h3>
                <div class="form-row">
                    <div class="form-group col-md-6"><label for="nombre">Nombre</label><input id="nombre" class="form-control" th:field="*{nombre}"/><small class="text-danger" th:errors="*{nombre}"></small></div>
                    <div class="form-group col-md-6"><label for="apellido">Apellido</label><input id="apellido" class="form-control" th:field="*{apellido}"/><small class="text-danger" th:errors="*{apellido}"></small></div>
                    <div class="form-group col-md-4"><label for="dni">DNI</label><input id="dni" class="form-control" type="number" min="1" th:field="*{dni}"/><small class="text-danger" th:errors="*{dni}"></small></div>
                    <div class="form-group col-md-4"><label for="fechaNacimiento">Fecha de nacimiento</label><input id="fechaNacimiento" class="form-control" type="date" th:field="*{fechaNacimiento}"/><small class="text-danger" th:errors="*{fechaNacimiento}"></small></div>
                    <div class="form-group col-md-4"><label for="fechaIngreso">Fecha de ingreso al predio</label><input id="fechaIngreso" class="form-control" type="date" th:field="*{fechaIngreso}"/><small class="text-danger" th:errors="*{fechaIngreso}"></small></div>
                    <div class="form-group col-md-6"><label for="email">Email de contacto</label><input id="email" class="form-control" type="email" th:field="*{email}"/><small class="text-danger" th:errors="*{email}"></small></div>
                    <div class="form-group col-md-6"><label for="contacto">Teléfono (opcional)</label><input id="contacto" class="form-control" th:field="*{contacto}"/></div>
                    <div class="form-group col-md-4">
                        <label for="tipoEmpleado">Tipo de responsable</label>
                        <select id="tipoEmpleado" class="form-control" th:field="*{tipoEmpleado}" onchange="actualizarResponsable()">
                            <option value="">Seleccioná un tipo</option>
                            <option th:each="tipo : ${tiposEmpleado}" th:value="${tipo}" th:text="${tipo.descripcion}"></option>
                        </select><small class="text-danger" th:errors="*{tipoEmpleado}"></small>
                    </div>
                    <div id="campoTurno" class="form-group col-md-4 d-none"><label for="turno">Turno de cajero</label><select id="turno" class="form-control" th:field="*{turno}"><option value="">Seleccioná</option><option th:each="op : ${turnos}" th:value="${op}" th:text="${op}"></option></select></div>
                    <div id="campoRolCocina" class="form-group col-md-4 d-none"><label for="rolCocina">Rol de cocina</label><select id="rolCocina" class="form-control" th:field="*{rolCocina}"><option value="">Seleccioná</option><option th:each="op : ${rolesCocina}" th:value="${op}" th:text="${op.descripcion}"></option></select></div>
                </div>

                <hr/>
                <h3 class="h5 mb-3">Cuenta para iniciar sesión</h3>
                <div class="form-row">
                    <div class="form-group col-md-6"><label for="username">Usuario</label><input id="username" class="form-control" th:field="*{username}" maxlength="100" autocomplete="username"/><small class="text-danger" th:errors="*{username}"></small></div>
                    <div class="form-group col-md-6"><label for="password">Contraseña</label><input id="password" class="form-control" type="password" th:field="*{password}" autocomplete="new-password"/><small class="text-danger" th:errors="*{password}"></small></div>
                </div>
                <button class="btn btn-dorado" type="submit">Registrar unidad y responsable</button>
                <a class="btn btn-link" th:href="@{/}">Cancelar</a>
            </fieldset>
        </form>
    </main>

    <footer th:replace="~{layout :: footer}"></footer>
    <div th:replace="~{layout :: scripts}"></div>
    <script>
        function mostrar(id, visible) {
            const section = document.getElementById(id);
            section.classList.toggle('d-none', !visible);
            section.querySelectorAll('input, select').forEach(element => element.disabled = !visible);
        }
        function actualizarUnidad() {
            const tipo = document.getElementById('tipoUnidad').value;
            mostrar('camposFoodTruck', tipo === 'FOOD_TRUCK');
            mostrar('camposPuesto', tipo === 'PUESTO');
        }
        function actualizarResponsable() {
            const tipo = document.getElementById('tipoEmpleado').value;
            mostrar('campoTurno', tipo === 'CAJERO');
            mostrar('campoRolCocina', tipo === 'COCINA');
        }
        actualizarUnidad();
        actualizarResponsable();
    </script>
</body>
</html>
