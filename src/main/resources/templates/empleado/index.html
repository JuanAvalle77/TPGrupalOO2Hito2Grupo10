<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head}"></head>
<body>
    <nav th:replace="~{layout :: navbar}"></nav>

    <main class="container">
        <div class="panel-head">
            <span class="rol">Empleado</span>
            <h2>Mi panel</h2>
        </div>

        <div class="row">
            <!-- Cada caso de uso de empleado reemplaza su tarjeta por un <a class="cu-card" th:href="..."> -->
            <div class="col-md-6 mb-4"><div class="cu-card"><span class="pendiente">Pendiente</span>
                <h4>Mi información</h4><p>Festivales y unidades en las que trabajé.</p></div></div>
            <div class="col-md-6 mb-4"><div class="cu-card"><span class="pendiente">Pendiente</span>
                <h4>Recibo de sueldo</h4><p>Descargar el recibo de cada festival en PDF.</p></div></div>
            <div class="col-md-6 mb-4"><div class="cu-card"><span class="pendiente">Pendiente</span>
                <h4>Dónde trabajo hoy</h4><p>Festival activo y unidad en la que me toca trabajar.</p></div></div>
            <div class="col-md-6 mb-4"><a class="cu-card" th:href="@{/empleado/cerrar-caja}">
                <h4>Cerrar caja</h4><p>Solo cajeros: cierre de caja del día.</p></a></div>
        </div>
    </main>

    <footer th:replace="~{layout :: footer}"></footer>
    <div th:replace="~{layout :: scripts}"></div>
</body>
</html>
