<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head}"></head>
<body>
    <nav th:replace="~{layout :: navbar}"></nav>

    <main class="container py-4" style="margin-top: 70px; max-width: 480px;">
        <div class="page-header">
            <h2>Iniciar sesion</h2>
        </div>

        <div class="alert alert-danger" th:if="${error != null}">Usuario o contrasenia incorrectos.</div>
        <div class="alert alert-success" th:if="${logout != null}">Cerraste sesion correctamente.</div>

        <div class="card form-card">
            <div class="card-body">
                <form th:action="@{/loginprocess}" method="post">
                    <div class="mb-3">
                        <label for="username" class="col-form-label">Usuario</label>
                        <input type="text" class="form-control" id="username" name="username" required/>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="col-form-label">Contrasenia</label>
                        <input type="password" class="form-control" id="password" name="password" required/>
                    </div>
                    <button type="submit" class="btn btn-primary">Ingresar</button>
                </form>
            </div>
        </div>
    </main>

    <footer th:replace="~{layout :: footer}"></footer>
    <div th:replace="~{layout :: scripts}"></div>
</body>
</html>
