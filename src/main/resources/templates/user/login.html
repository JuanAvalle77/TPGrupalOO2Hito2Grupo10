<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head}"></head>
<body>
    <nav th:replace="~{layout :: navbar}"></nav>

    <main class="container">
        <div class="login-wrap">
            <div class="login-card">
                <img th:src="@{/imgs/logo-unla.png}" alt="Universidad Nacional de Lanús"/>
                <h2>Iniciar sesión</h2>
                <p class="sub">Ingresá con tu usuario de Epicentro Gourmet</p>

                <div class="alert alert-danger" th:if="${error != null}">Usuario o contraseña incorrectos.</div>
                <div class="alert alert-success" th:if="${logout != null}">Cerraste sesión correctamente.</div>
                <div class="alert alert-success" th:if="${registroExitoso != null}">La unidad y la cuenta de responsable se registraron. Ya podés iniciar sesión.</div>

                <form th:action="@{/loginprocess}" method="post">
                    <div class="form-group">
                        <label for="username">Usuario</label>
                        <input type="text" class="form-control" id="username" name="username" autofocus required/>
                    </div>
                    <div class="form-group">
                        <label for="password">Contraseña</label>
                        <input type="password" class="form-control" id="password" name="password" required/>
                    </div>
                    <button type="submit" class="btn btn-dorado">Ingresar</button>
                </form>
            </div>
        </div>
    </main>

    <footer th:replace="~{layout :: footer}"></footer>
    <div th:replace="~{layout :: scripts}"></div>
</body>
</html>
